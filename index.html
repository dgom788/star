<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>문단 별표 제거</title>
<style>
:root{font-family:Arial,'Malgun Gothic',sans-serif;color:#25303b;background:#f5f6f8}*{box-sizing:border-box}body{margin:0;padding:36px 18px}.wrap{max-width:1100px;margin:auto}header{margin-bottom:24px}h1{font-size:27px;margin:0 0 9px;letter-spacing:-.7px}p{color:#6c7784;margin:0;font-size:14px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e0e5eb;border-radius:17px;padding:20px;box-shadow:0 5px 22px #27344708}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.top strong{font-size:16px}.count{font-size:12px;color:#8893a0}textarea{width:100%;height:440px;resize:vertical;border:1px solid #dce2e8;border-radius:11px;padding:17px;font:15px/1.9 'Malgun Gothic',sans-serif;color:#26313c;background:#fcfdfe;outline:none;white-space:pre-wrap}textarea:focus{border-color:#8198b7;box-shadow:0 0 0 3px #8198b71a}textarea[readonly]{background:#f8fafc}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}button{border:1px solid #d9e0e8;background:white;color:#3d4b5b;border-radius:10px;padding:11px 16px;font-weight:700;font-size:13px;cursor:pointer;min-height:43px}button:hover{background:#eef2f6}.primary{background:#354d68;color:white;border-color:#354d68}.primary:hover{background:#263b54}.copy{background:#e8eef6;border-color:#d7e1ed;color:#28486a}.status{min-height:23px;margin-top:13px;color:#53715f;font-size:13px}@media(max-width:740px){body{padding:24px 12px}.grid{grid-template-columns:1fr}textarea{height:310px}h1{font-size:24px}.panel{padding:15px}}
</style>
</head>
<body><main class="wrap"><header><h1>문단 별표 제거</h1><p>글을 붙여넣으면 문단을 감싼 별표만 제거합니다. 대사와 줄바꿈은 그대로 유지됩니다.</p></header><div class="grid"><section class="panel"><div class="top"><strong>원문</strong><span class="count" id="inCount">0자</span></div><textarea id="source" placeholder="여기에 원문을 붙여넣으세요." spellcheck="false"></textarea><div class="actions"><button class="primary" id="convert">별표 제거하기</button><button id="clear">전체 지우기</button></div></section><section class="panel"><div class="top"><strong>변환 결과</strong><span class="count" id="outCount">0자</span></div><textarea id="result" placeholder="변환 결과가 여기에 표시됩니다." spellcheck="false"></textarea><div class="actions"><button class="copy" id="copy">결과 복사</button><button id="undo">실행 취소</button></div></section></div><div class="status" id="status" role="status" aria-live="polite"></div></main>
<script>
const source=document.getElementById('source'),result=document.getElementById('result'),status=document.getElementById('status');let previous='';
const count=()=>{document.getElementById('inCount').textContent=source.value.length.toLocaleString()+'자';document.getElementById('outCount').textContent=result.value.length.toLocaleString()+'자'};
// Strip only a pair of asterisks enclosing an entire nonempty paragraph line.
function strip(text){return text.split(/(\r\n|\n|\r)/).map(part=>{if(/^(\r\n|\n|\r)$/.test(part))return part;const match=part.match(/^(\s*)\*([^\r\n]*\S[^\r\n]*?)\*(\s*)$/);return match?match[1]+match[2]+match[3]:part}).join('')}
source.addEventListener('input',count);result.addEventListener('input',count);
document.getElementById('convert').onclick=()=>{previous=result.value;result.value=strip(source.value);count();status.textContent='문단 앞뒤 별표를 제거했습니다.'};
document.getElementById('clear').onclick=()=>{previous=result.value;source.value='';result.value='';count();status.textContent='입력과 결과를 지웠습니다.';source.focus()};
document.getElementById('undo').onclick=()=>{const current=result.value;result.value=previous;previous=current;count();status.textContent='이전 결과로 되돌렸습니다.'};
document.getElementById('copy').onclick=async()=>{if(!result.value){status.textContent='복사할 결과가 없습니다.';return}try{await navigator.clipboard.writeText(result.value);status.textContent='결과를 복사했습니다.'}catch(e){result.focus();result.select();try{if(!document.execCommand('copy'))throw Error();status.textContent='결과를 복사했습니다.'}catch(e){status.textContent='자동 복사에 실패했습니다. 결과를 선택하여 직접 복사해 주세요.'}}};count();
</script></body></html>
